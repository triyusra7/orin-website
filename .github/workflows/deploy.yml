name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: "/orin-website"
          NEXT_PUBLIC_SITE_URL: "https://triyusra7.github.io/orin-website"
        run: npm run build

      - name: Add index.html fallback for root redirection
        run: |
          if [ -f out/id/index.html ]; then
            cp out/id/index.html out/index.html
          elif [ -f out/id.html ]; then
            cp out/id.html out/index.html
          else
            echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./id/"><script>window.location.href="./id/";</script></head><body><p>Redirecting...</p></body></html>' > out/index.html
          fi

      - name: Create .nojekyll file
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
